<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A small multilingual independent web journal.">
    <title>Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="system/style.css">
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="./">Dastan Medetbekov<span aria-hidden="true">.</span></a>
        <div class="header-meta">
            <span id="post-count">Loading</span>
            <label class="language-picker" for="language-select">Language</label>
            <select id="language-select" aria-label="Filter posts by language"></select>
        </div>
    </header>
    <main>
        <section class="intro" aria-labelledby="page-title">
            <p class="kicker">Dastan Medetbekov's web journal</p>
            <h1 id="page-title">Small notes,<br><em>kept carefully.</em></h1>
        </section>
        <section id="post-list" class="post-list" aria-live="polite"></section>
        <article id="post-view" class="post-view" hidden>
            <a class="back-link" href="./">&larr; All notes</a>
            <div id="post-content"></div>
        </article>
        <p id="empty-state" class="empty-state" hidden>No notes in this language yet.</p>
    </main>
    <footer class="site-footer">Dastan Medetbekov. Hosted on GitHub Pages.</footer>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" crossorigin="anonymous"></script>
    <script src="system/app.js"></script>
</body>
</html>
